spring.application.name=EmpowHer
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.data.jdbc.dialect=postgresql
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.jpa.show-sql=true

server.port=8080
# server.error.whitelabel.enabled=false

spring.main.lazy-initialization=true
#debug=true

## Properties about sessions
# Prevents JavaScript access
server.servlet.session.cookie.http-only=true
# Only allow cookies over HTTPS
server.servlet.session.cookie.secure=true
# Session timeout after 30 minutes
server.servlet.session.timeout=30m
# Use cookies, not URL rewriting
server.servlet.session.tracking-modes=cookie

## Properties about mail sender
spring.mail.host=${MAIL_HOST}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.port=${MAIL_PORT}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

## Properties for storage service
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=512KB
